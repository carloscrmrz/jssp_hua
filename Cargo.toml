[package]
name = "jssp"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
petgraph = "0.8.3"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
